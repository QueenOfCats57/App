<div class="course-list-container">
  <!-- Заголовок с шаблонной переменной -->
  <div class="page-header">
    <h1 #pageTitle class="main-title">
      Каталог курсов
    </h1>
    <p class="subtitle">Найдите идеальный курс для изучения английского</p>
  </div>

  <!-- Компонент статистики с ContentChild -->
  <app-course-statistics 
    [totalCourses]="totalCourses"
    [averageRating]="averageRating"
    [totalStudents]="totalStudents">
    
    <!-- ContentChild шаблон для заголовка -->
    <ng-template #statHeader>
      <div class="custom-stat-header">
        <span class="stat-emoji">📊</span>
        <span>Статистика платформы</span>
      </div>
    </ng-template>
    
    <!-- ContentChild шаблон для футера -->
    <ng-template #statFooter>
      <div class="custom-stat-footer">
        <span>{{ filteredCourses.length }} курсов по вашему запросу</span>
      </div>
    </ng-template>
  </app-course-statistics>

  <!-- Кнопка показа/скрытия фильтров -->
  <button class="toggle-filters-btn" (click)="toggleFilters()">
    {{ isFiltersVisible ? '▼ Скрыть фильтры' : '▶ Показать фильтры' }}
  </button>

  <!-- Компонент фильтров -->
  <app-course-filter #filterComponent
    [selectedLevel]="selectedLevel"
    [selectedCategory]="selectedCategory"
    [showOnlyPopular]="showOnlyPopular"
    [showOnlyNew]="showOnlyNew"
    [searchQuery]="searchQuery"
    [sortBy]="sortBy"
    [sortDirection]="sortDirection"
    [isVisible]="isFiltersVisible"
    (selectedLevelChange)="onLevelChange($event)"
    (selectedCategoryChange)="onCategoryChange($event)"
    (showOnlyPopularChange)="onPopularChange($event)"
    (showOnlyNewChange)="onNewChange($event)"
    (searchQueryChange)="onSearchChange($event)"
    (sortByChange)="onSortByChange($event)"
    (sortDirectionChange)="onSortDirectionChange($event)"
    (resetFilters)="resetAllFilters()">
  </app-course-filter>

  <!-- Переключатель вида с шаблонными переменными -->
  <div class="view-switcher">
    <button #gridBtn
            [class.active]="selectedViewMode === 'grid'"
            (click)="changeViewMode('grid')">
      📱 Сетка
    </button>
    <button #listBtn
            [class.active]="selectedViewMode === 'list'"
            (click)="changeViewMode('list')">
      📋 Список
    </button>
    <button #compactBtn
            [class.active]="selectedViewMode === 'compact'"
            (click)="changeViewMode('compact')">
      📊 Компактный
    </button>
  </div>

  <!-- Информация о результатах -->
  <div class="results-info" *ngIf="filteredCourses.length > 0">
    Найдено курсов: {{ filteredCourses.length }}
  </div>
  
  <div class="no-results" *ngIf="filteredCourses.length === 0">
    <p>По вашему запросу ничего не найдено</p>
    <button class="reset-btn" (click)="resetAllFilters()">Сбросить фильтры</button>
  </div>

  <!-- Отображение курсов с использованием компонента CourseCard -->
  <div [ngSwitch]="selectedViewMode" class="courses-display">
    <!-- Grid режим -->
    <div *ngSwitchCase="'grid'" class="courses-grid">
      <app-course-card #filterElement
        *ngFor="let course of filteredCourses"
        [course]="course"
        [viewMode]="'grid'"
        [isHighlighted]="highlightedCourseId === course.id"
        (cardClick)="onCardClick($event)"
        (like)="onCourseLike($event)"
        (viewDetails)="onViewDetails($event)">
      </app-course-card>
    </div>

    <!-- List режим -->
    <div *ngSwitchCase="'list'" class="courses-list">
      <app-course-card #filterElement
        *ngFor="let course of filteredCourses"
        [course]="course"
        [viewMode]="'list'"
        [isHighlighted]="highlightedCourseId === course.id"
        (cardClick)="onCardClick($event)"
        (like)="onCourseLike($event)"
        (viewDetails)="onViewDetails($event)">
      </app-course-card>
    </div>

    <!-- Compact режим (таблица) -->
    <div *ngSwitchCase="'compact'" class="courses-compact">
      <table class="compact-table">
        <thead>
          <tr>
            <th>Курс</th>
            <th>Уровень</th>
            <th>Длит.</th>
            <th>Рейтинг</th>
            <th>Цена</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let course of filteredCourses">
            <td class="compact-title">
              <app-course-card #filterElement
                [course]="course"
                [viewMode]="'compact'"
                [isHighlighted]="highlightedCourseId === course.id"
                (cardClick)="onCardClick($event)"
                (like)="onCourseLike($event)"
                (viewDetails)="onViewDetails($event)">
              </app-course-card>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Дополнительный контент через ng-content (для демонстрации) -->
  <ng-content></ng-content>

  <!-- Кнопка "На главную" -->
  <div class="back-link-container">
    <a routerLink="/" class="back-link">← Вернуться на главную</a>
  </div>
</div>
